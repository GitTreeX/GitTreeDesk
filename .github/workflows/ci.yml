name: CI

# Checks only: no packaging, no publishing. Releases are tagged and handled by
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      # node-pty has no Linux prebuild, so the app build needs it compiled here.
      - run: pnpm build:native
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

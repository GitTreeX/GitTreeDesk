appId: com.gitreedesk.app
productName: GitTreeDesk
directories:
  buildResources: build
  output: ../../release
files:
  - out/**
  - package.json
  - '!**/*.map'
# Native modules are N-API, so they load under Electron without a rebuild.
# better-sqlite3 and node-pty ship prebuilds for macOS/Windows; on Linux
# node-pty has none and its install script compiles build/Release/pty.node.
npmRebuild: false
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/@parcel/watcher/**
  - node_modules/@parcel/watcher-*/**
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}
# v1 ships unsigned (notarization is deferred), so never look for a signing
# identity: CI runners and contributors without certificates still produce
# complete artifacts. Which architectures are built follows the host.
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  identity: null
linux:
  icon: build/icon.png
  category: Development
  # electron-builder falls back to the package name for the binary, and a scoped
  # name (`@gitreedesk/desktop`) cannot appear in a Linux file path.
  executableName: GitTreeDesk
  # Window/desktop-association: `desktopName` lives in package.json (Electron
  # reads it as app_id / WM_CLASS); this flag makes the installed .desktop file
  # use the same name so DEs link running windows to the entry.
  syncDesktopName: true
  target:
    - AppImage
    - deb
# The default deb artifact name is `${name}_${version}_${arch}.${ext}`, where
# `${name}` is the scoped package name (`@gitreedesk/desktop`). That expands to
# a path under a `@gitreedesk/` parent directory, but fpm will not create the
# parent and aborts. Pin a flat name under `release/`.
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
